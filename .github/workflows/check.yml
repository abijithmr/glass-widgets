name: Build check

# Builds the debug APK on every branch except main so a change can be compiled
# without publishing a release. Pushes to main are handled by release.yml.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK so it can be installed
        uses: actions/upload-artifact@v4
        with:
          name: glass-widgets-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
